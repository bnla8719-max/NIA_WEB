name: Sync Naver blog portfolio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-blog.yml
      - .github/sync-blog.py
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-blog-portfolio

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/sync-blog.py
      - name: Save updated portfolio feed
        run: |
          mkdir -p assets/blog-portfolio
          git add -A -- blog-portfolio.json assets/blog-portfolio/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update NIA S&D portfolio feed'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
